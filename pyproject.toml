[project]
name = "pepkio-pi-charge-consensus"
version = "0.1.0"
description = "Python client for Pepkio pi-charge-consensus tool"
readme = "README_PYPI.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
]

[project.scripts]
pepkio-pi-charge-consensus = "pepkio_pi_charge_consensus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_pi_charge_consensus"]

[dependency-groups]
dev = [
    "hatchling>=1.25.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
